<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Ejercicio 1: Acceso al DOM básico
     Obten desde JS el elemento <p> con querySelector
     Muestra su texto en la consola
     Cambia el texto a: "Mansaje actualizado-->
    <div id="box">
        <p class="msg">Texto inicial</p>
    </div>

<!-- Ejercicio 2: Acceso al DOM avanzado
     Selecciona todos los .item.
     Recorre la lista con un for of
     Cambia todos los textos a: Elemento 1, Elemento 2, Elemento 3
-->

    <ul id="lista">
        <li class="item">Uno</li>
        <li class="item">Dos</li>
        <li class="item">Tres</li>
    </ul>

<!-- Ejercicio 3: Modificacion contenido y estilos (basico)
     Cambia el color del texto a azul
     Aumenta el tamaño de la letra a 28px
     Cambia el contenido a: "Perfil de usuario
-->
    <h2 id="title">Perfil</h2>

<!-- Ejercicio 5: Crear y añadir elementos
     Crea un elemento <p>
     Añade el texto: "Elemento añadido dinámicamente"
     Inserta un parrado dentro de #container
 -->
    <div id="container"></div>

<!-- Ejercicio 6: Crear y añadir elementos
     Cuando se pulse el boyon, pide con un prompt la tarea, crear un li, añadelo al ul,
     cada li deebe borarse al hacer clic en el
-->

    <ul id="tareas"></ul>
    <button id="add">Añadir tarea</button>

<!-- Ejercicio 7: Eventos del DOM basico: Añade un listener a al boton y que muestre un alert
     "Hola desde el DOM"
-->
    <button id="saludar">Saludar</button>

<!-- Ejercicio 8: Eventos del DOM. Implementa la delegacion de eventos, pon un unico listener
     sobre el ul, detecta que li fue pulsado y muestra un mensaje distinto segun el data-op
-->
    <ul id="menu">
        <li data-op="perfil">Perfil</li>
        <li data-op="config">Configuracion</li>
        <li data-op="salir">Salir</li>
    </ul>

<!-- Ejercicio 9: Mini formulario validado con JS.
    Evita el envio del formulario
    El usuario debe tener minimo 3 caracteres.
    Contraseña minimo 6 caracteres
    Si falla mensaje en rojo, sino en verde "Acceso permitido"
-->
    <form id="login">
        <input type="text" id="user" placeholder="Usuario" required>
        <input type="password" id="pass" placeholder="Contraseña" required>
        <button>Entrar</button>
    </form>
    <p id="msg"></p>

    <script src="js/ej1.js"></script>
    <script src="js/ej2.js"></script>
    <script src="js/ej3.js"></script>
    <script src="js/ej5.js"></script>
    <script src="js/ej6.js"></script>
    <script src="js/ej7.js"></script>
    <script src="js/ej8.js"></script>
    <script src="js/ej9.js"></script>
</body>
</html>
